<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Spaces Manager | Musicala</title>
  <meta name="description" content="Spaces Manager | Musicala — Gestión de clientes, paquetes de horas, reservas y consumo." />
  <meta name="theme-color" content="#f6f8ff" />
  <meta name="color-scheme" content="light" />

  <link rel="icon" href="./assets/logo.png" />
  <link rel="apple-touch-icon" href="./assets/logo.png" />
  <link rel="preload" as="image" href="./assets/logo.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./styles-spaces.css" />
</head>
<body>

  <a class="skip-link" href="#main">Saltar al contenido</a>

  <!-- Barra de progreso global (carga de datos) -->
  <div id="loadingBar" class="loading-bar" hidden><div class="loading-bar-fill"></div></div>

  <!-- ============ LOGIN GATE ============ -->
  <div id="authGate" class="auth-gate">
    <div class="auth-card card">
      <img src="./assets/logo.png" alt="Musicala" class="auth-logo" />
      <h1>Spaces Manager</h1>
      <p class="muted">Gestión de espacios, paquetes de horas y reservas.</p>
      <button id="btnLogin" class="btn-primary" type="button">Entrar con Google</button>
      <p id="authError" class="auth-error" role="alert"></p>
      <p class="auth-hint muted">Acceso restringido a correos autorizados de Musicala.</p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="appShell" hidden>
    <header class="app-header" role="banner">
      <div class="header-left">
        <img src="./assets/logo.png" alt="Musicala" class="logo" />
        <div class="header-title">
          <h1>Spaces Manager</h1>
          <span id="currentContext">Dashboard general</span>
        </div>
      </div>
      <nav class="header-nav" id="topNav" aria-label="Secciones">
        <button class="nav-btn" data-nav="dashboard">Dashboard</button>
        <button class="nav-btn" data-nav="clientes">Clientes</button>
        <button class="nav-btn" data-nav="reservas">Reservas</button>
        <button class="nav-btn" data-nav="cobros">Cobros</button>
        <button class="nav-btn" data-nav="alertas">Alertas</button>
        <button class="nav-btn" data-nav="auditoria">Auditoría</button>
        <button class="nav-btn" data-nav="importar">Importar</button>
      </nav>
      <div class="header-right">
        <span id="userBadge" class="user-badge"></span>
        <button id="btnLogout" class="btn-secondary btn-sm" type="button">Salir</button>
      </div>
    </header>

    <main id="main" class="app-main" role="main" tabindex="-1">
      <div id="viewRoot"><!-- las vistas se renderizan aquí --></div>
    </main>
  </div>

  <!-- Modal genérico -->
  <dialog id="appModal" aria-labelledby="appModalTitle">
    <form method="dialog" class="modal-content" id="appModalForm">
      <h3 id="appModalTitle">Modal</h3>
      <div id="appModalBody" class="modal-body"></div>
      <div id="appModalMsg" class="dialog-msg" style="display:none"></div>
      <div class="modal-actions">
        <button value="cancel" class="btn-secondary" type="button" id="appModalCancel">Cancelar</button>
        <button class="btn-primary" value="default" id="appModalOk">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./js/app-firebase.js"></script>

  <style>
    .sr-only{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .skip-link{ position:absolute; left:-999px; top:10px; z-index:9999; padding:10px 12px; border-radius:12px; background:#fff; box-shadow:0 10px 30px rgba(11,16,32,.12); border:1px solid rgba(11,16,32,.12); color:#0b1020; text-decoration:none; }
    .skip-link:focus{ left:10px; }
    dialog{ max-width:min(620px, calc(100vw - 28px)); }
  </style>

</body>
</html>
